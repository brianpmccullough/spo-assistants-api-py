[project]
name = "spo-assistants"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brian P. McCullough", email = "brianpmccullough@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.146.0",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
spo-assistants = "spo_assistants:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"

[tool.fastapi]
entrypoint = "spo_assistants.main:app"
